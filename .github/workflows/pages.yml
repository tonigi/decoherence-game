# Publish the game to GitHub Pages. There is no build step: the site is the
# static files (index.html, style.css, src/, levels/), served as ES modules.
name: Pages

on:
  push:
    branches: [born-rule]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run verify

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for git describe
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html style.css src levels design _site/
          touch _site/.nojekyll
      - name: Stamp the version
        run: |
          # v0.1.0 on a tagged commit, v0.1.0-12-g727fe61 after it
          printf '{"version":"%s","commit":"%s","built":"%s"}\n' \
            "$(git describe --tags --always)" "$(git rev-parse --short HEAD)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

